name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs.yaml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs.yaml'

permissions:
  contents: read

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Dead internal links fail the build (markdown.link.checkDeadLinks).
      - name: Build
        run: npm run build

      - name: Upload the documentation artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: website/doc_build
          retention-days: 7

  # A merge into main refreshes the internal portal
  # (documentation-internal.scality.com/OpenSource/cosi-driver/main/).
  # The portal repository publishes it; this repository holds no server credentials.
  publish-internal:
    name: Publish to documentation-internal
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token to trigger the portal workflow
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: documentation.scality.com
          permission-actions: write

      - name: Trigger the portal publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          gh workflow run publish-oss-docs.yaml
          --repo scality/documentation.scality.com
          -f project=cosi-driver
          -f site=internal
          -f version=main
          -f run_id=${{ github.run_id }}
