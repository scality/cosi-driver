name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to be released (e.g., v1.0.0)"
        required: true
      all_platforms:
        description: "Build for all platforms (linux/amd64,linux/arm64) or just linux/amd64"
        required: false
        type: boolean
        default: false

jobs:
  prod-container-with-docker:
    permissions:
      contents: read
      packages: write
    uses: scality/workflows/.github/workflows/docker-build.yaml@v2
    with:
      context: .
      name: cosi-driver
      namespace: ${{ github.repository_owner }}
      tag: ${{ inputs.tag }}
      platforms: ${{ inputs.all_platforms && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

  # Built at the tag's commit: links to files outside docs/ point at the tag.
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build the documentation site
        env:
          DOCS_GIT_REF: ${{ inputs.tag }}
        run: |
          npm ci
          npm run build

      - name: Upload the documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: website/doc_build
          retention-days: 7

  # Public portal (documentation.scality.com/OpenSource/cosi-driver/<major.minor>/),
  # published by the portal repository from the artifact above. Not a
  # dependency of the other jobs, so a portal outage does not block a release.
  publish-portal-docs:
    needs: [build-docs]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Generate a token to trigger the portal workflow
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: documentation.scality.com
          permission-actions: write

      - name: Trigger the portal publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: >-
          gh workflow run publish-oss-docs.yaml
          --repo scality/documentation.scality.com
          -f project=cosi-driver
          -f site=external
          -f "version=$TAG"
          -f run_id=${{ github.run_id }}

  create-github-release:
    runs-on: ubuntu-latest
    needs: [prod-container-with-docker, package-helm-chart]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target_commitish: ${{ github.sha }}
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          generate_release_notes: true

  package-helm-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.16.2

      - name: login to ghcr.io with helm
        run: helm registry login -u actions -p ${{ github.token }} ghcr.io

      - name: Package Helm Chart
        run: |
          helm package ./helm/scality-cosi-driver --version ${{ inputs.tag }} --app-version ${{ inputs.tag }}

      - name: Upload Helm Chart as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: scality-cosi-driver-${{ inputs.tag }}.tgz

      - name: Push helm chart to ghcr.io
        run: helm push scality-cosi-driver-${{ inputs.tag }}.tgz oci://ghcr.io/${{ github.repository }}/helm-charts

      - name: Pull the helm chart
        run: helm pull oci://ghcr.io/${{ github.repository }}/helm-charts/scality-cosi-driver --version ${{ inputs.tag }}

      - name: Show the helm chart
        run: helm show all oci://ghcr.io/${{ github.repository }}/helm-charts/scality-cosi-driver --version ${{ inputs.tag }}
  
      - name: Template the helm chart
        run: helm template oci://ghcr.io/${{ github.repository }}/helm-charts/scality-cosi-driver --version ${{ inputs.tag }}
